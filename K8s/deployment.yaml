apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-devsecops-ai
  namespace: devsecops-ai

spec:
  replicas: 2

  selector:
    matchLabels:
      app: java-devsecops-ai

  template:
    metadata:
      labels:
        app: java-devsecops-ai

    spec:
      containers:
      - name: java-devsecops-ai

        image: ameysalvi5675/java-devsecops-ai:1.0

        ports:
        - containerPort: 8080

        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"

          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080

          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080

          initialDelaySeconds: 15
          periodSeconds: 5