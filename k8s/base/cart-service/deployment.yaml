apiVersion: apps/v1
kind: Deployment

metadata:
  name: cart-service
  namespace: devsecops-ai
  
spec:
  replicas: 1

  selector:
    matchLabels:
      app: cart-service

  template:
    metadata:
      labels:
        app: cart-service

    spec:
      containers:
      - name: cart-service

        image: cart-service:v1

        imagePullPolicy: Never

        ports:
        - containerPort: 8080

        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/productdb

        - name: SPRING_DATASOURCE_USERNAME
          value: postgres

        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres