apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  namespace: devsecops-ai

spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
      - name: payment-service

        image: payment-service:v1

        imagePullPolicy: Never

        ports:
        - containerPort: 8080

        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/productdb

        - name: SPRING_DATASOURCE_USERNAME
          value: postgres

        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres